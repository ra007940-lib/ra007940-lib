<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sowl</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5 mb-4">
        <div class="row justify-content-center">
            <div class="col-9 text-center">
                <h2>Siga a Sowl e empodere-se</h2>
                <p>
                    A Sowl Digital desenvolve soluções de comunicação e conteúdo.
                    Siga nossas redes sociais para acompanhar as novidades.
                </p>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-2 text-center">
                <div class="mb-4">
                    <img src="imagens/facebook.jpg" alt="Facebook" class="img-fluid">
                </div>
                <div>
                    <img src="imagens/instagram.jpg" alt="Instagram" class="img-fluid">
                </div>
            </div>
            <div class="col-6">
                <img src="imagens/channel.jpg" alt="Imagem da Sowl" class="img-fluid">
            </div>
        </div>
    </div>
</body>
</html>
